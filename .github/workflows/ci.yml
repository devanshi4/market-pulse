name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python files compile
        run: python -m compileall -q data_generators ingestion orchestration

      - name: Config files are valid JSON / YAML
        run: |
          pip install --quiet pyyaml
          python -c "import json; json.load(open('ingestion/debezium_postgres_connector.json'))"
          python -c "import yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('dbt_project/**/*.yml', recursive=True) + ['docker-compose.yml','workspace.yaml']]"

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform validate
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate
